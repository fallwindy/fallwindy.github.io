baseURL = 'https://fallwindy.github.io/'
languageCode = 'zh-cn'
title = 'Fallwindy Blog'
theme = 'PaperMod'

[params]
  author = 'Fallwindy'
  description = 'Fallwindy 的技术博客'
  avatar = '/images/avatar.jpg'

  github = 'https://github.com/fallwindy'

  email = '你的邮箱@example.com'

  mainSections = ['posts']

  ShowReadingTime = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowBreadCrumbs = true
  ShowPostNavLinks = true

  defaultTheme = 'auto'
  disableThemeToggle = false

